<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" width="620" height="220">
  <rect x="1" y="1" width="618" height="218" rx="14" fill="#fdfbf6" stroke="#e2ded4"/>

  <!-- 主路径 -->
  <path d="M60 178 C190 178 250 66 470 54" fill="none" stroke="#e6e0d3" stroke-width="10"
        stroke-linecap="round"/>

  <!-- 起点 A2 -->
  <circle cx="60" cy="178" r="10" fill="#1b1b1b"/>
  <text x="42" y="206" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="14" font-weight="700" fill="#1b1b1b">A2</text>

  <!-- 终点 B1 -->
  <circle cx="470" cy="54" r="10" fill="#b8141e"/>
  <text x="452" y="32" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="14" font-weight="700" fill="#b8141e">B1</text>

  <!-- 四个里程碑（坐标沿贝塞尔曲线计算） -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700">
    <circle cx="148" cy="160" r="14" fill="#ffffff" stroke="#c9982b" stroke-width="3"/>
    <text x="148" y="164.5" text-anchor="middle" fill="#8a6a15">1</text>

    <circle cx="231" cy="120" r="14" fill="#ffffff" stroke="#c9982b" stroke-width="3"/>
    <text x="231" y="124.5" text-anchor="middle" fill="#8a6a15">2</text>

    <circle cx="318" cy="83" r="14" fill="#ffffff" stroke="#c9982b" stroke-width="3"/>
    <text x="318" y="87.5" text-anchor="middle" fill="#8a6a15">3</text>

    <circle cx="397" cy="62" r="14" fill="#ffffff" stroke="#c9982b" stroke-width="3"/>
    <text x="397" y="66.5" text-anchor="middle" fill="#8a6a15">4</text>
  </g>

  <!-- 图例 -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#3d3d3d">
    <g font-weight="700" fill="#8a6a15">
      <circle cx="452" cy="100" r="9" fill="#ffffff" stroke="#c9982b" stroke-width="2.5"/>
      <text x="452" y="104" text-anchor="middle" font-size="10">1</text>
    </g>
    <text x="470" y="104">Wortschatz</text>

    <g font-weight="700" fill="#8a6a15">
      <circle cx="452" cy="126" r="9" fill="#ffffff" stroke="#c9982b" stroke-width="2.5"/>
      <text x="452" y="130" text-anchor="middle" font-size="10">2</text>
    </g>
    <text x="470" y="130">H&#246;ren</text>

    <g font-weight="700" fill="#8a6a15">
      <circle cx="452" cy="152" r="9" fill="#ffffff" stroke="#c9982b" stroke-width="2.5"/>
      <text x="452" y="156" text-anchor="middle" font-size="10">3</text>
    </g>
    <text x="470" y="156">Grammatik</text>

    <g font-weight="700" fill="#8a6a15">
      <circle cx="452" cy="178" r="9" fill="#ffffff" stroke="#c9982b" stroke-width="2.5"/>
      <text x="452" y="182" text-anchor="middle" font-size="10">4</text>
    </g>
    <text x="470" y="182">Schreiben &amp; Sprechen</text>
  </g>
</svg>

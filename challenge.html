<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <meta property="og:site_name" content="Deutsch-Lernzimmer 德语自习室">
  <meta property="og:title" content="单词挑战：10 题一轮｜Deutsch-Lernzimmer">
  <meta property="og:description" content="同词性干扰项、两种出题方向，答错立刻给正确答案和例句，成绩存本机。">
  <meta property="og:url" content="https://bazaozhuo.github.io/deutsch--zimmer/challenge.html">
  <meta property="og:image" content="https://bazaozhuo.github.io/deutsch--zimmer/images/og/og-challenge.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="单词挑战：10 题一轮｜Deutsch-Lernzimmer">
  <meta name="twitter:description" content="同词性干扰项、两种出题方向，答错立刻给正确答案和例句，成绩存本机。">

  <!-- 先定主题再渲染，避免深色用户看到一瞬间的白闪 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (t === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <a class="skip-link" href="#main" data-i18n="skip.link">跳到主要内容</a>


  <header>
    <div class="header-top">
      <p class="site-title"><a href="index.html" data-i18n="site.title">Deutsch-Lernzimmer 德语自习室</a></p>
      <div class="header-controls">
        <button type="button" class="theme-toggle" id="theme-toggle"
                aria-pressed="false" aria-label="切换到深色模式">
          <svg class="theme-toggle__sun" viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.3 5.3l1.5 1.5M17.2 17.2l1.5 1.5M18.7 5.3l-1.5 1.5M6.8 17.2l-1.5 1.5"
                  stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <svg class="theme-toggle__moon" viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true">
            <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2Z"
                  stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </button>
        <button type="button" class="lang-toggle" id="lang-toggle"
                data-i18n="lang.button" data-i18n-aria-label="lang.aria">EN</button>
      </div>
    </div>
    <nav aria-label="主导航" data-i18n-aria-label="nav.main">
      <ul>
        <li><a href="index.html" data-i18n="nav.home">首页</a></li>
        <li><a href="wissen.html" data-i18n="nav.index">知识索引</a></li>
        <li><a href="challenge.html" aria-current="page" data-i18n="nav.challenge">单词挑战</a></li>
        <li><a href="vokabeln.html" data-i18n="nav.vocab">词汇表</a></li>
        <li><a href="notizen.html" data-i18n="nav.notes">笔记</a></li>
        <li><a href="kontakt.html" data-i18n="nav.contact">联系</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <h1 data-i18n="challenge.h1">单词挑战</h1>
    <p class="quiz-intro" data-i18n="challenge.lead">一轮 10 题，四个选项选一个。选错会立刻告诉你正确答案，并把例句摆出来。成绩只存在这台电脑的浏览器里。</p>

    <div class="quiz-controls">
      <div>
        <label for="mode" data-i18n="challenge.mode.label">考什么</label>
        <select id="mode">
          <option value="de-zh" data-i18n="challenge.mode.deZh">看德语 → 选中文</option>
          <option value="zh-de" data-i18n="challenge.mode.zhDe">看中文 → 选德语</option>
        </select>
      </div>
      <div>
        <label for="scope" data-i18n="challenge.scope.label">考哪些词</label>
        <select id="scope">
          <option value="all" data-i18n="challenge.scope.all">全部 703 个词</option>
          <option value="b1" data-i18n="challenge.scope.b1">B1 词汇（596 个）</option>
          <option value="notiz" data-i18n="challenge.scope.notiz">只要课本与笔记（107 个）</option>
        </select>
      </div>
      <div>
        <label for="len" data-i18n="challenge.len.label">题量</label>
        <select id="len">
          <option value="10" data-i18n="challenge.len.ten">10 题</option>
          <option value="20" data-i18n="challenge.len.twenty">20 题</option>
        </select>
      </div>
      <p class="stats">
        <span><span data-i18n="challenge.stat.qno">第</span> <b id="qNo">1</b>/<b id="qTot">10</b></span>
        <span><span data-i18n="challenge.stat.ok">答对</span> <b id="okCount">0</b></span>
        <span class="streak"><span data-i18n="challenge.stat.streak">连击</span> <b id="streak">0</b></span>
      </p>
    </div>

    <section class="quiz-card" id="quizCard" aria-live="polite">
      <p class="q-label" id="qLabel">这个德语词是什么意思？</p>
      <p class="q-word" id="qWord">—</p>
      <p class="q-sub" id="qSub"></p>
      <div class="options" id="options"></div>
      <p class="feedback" id="feedback" role="status"></p>
      <p class="q-actions">
        <button type="button" class="btn" id="nextBtn" disabled>下一题</button>
        <button type="button" class="btn btn-ghost" id="restartBtn" data-i18n="challenge.btn.restart">重新开始</button>
      </p>
    </section>

    <section class="result" id="result" hidden>
      <h2 id="resTitle">这轮结束了</h2>
      <p class="score"><span id="resScore">0</span><small> / <span id="resTotal">10</span></small></p>
      <p class="meta" id="resMeta"></p>
      <p class="q-actions">
        <button type="button" class="btn" id="againBtn" data-i18n="challenge.btn.again">再来一轮</button>
        <button type="button" class="btn btn-ghost" id="backBtn" data-i18n="challenge.btn.back">回到题目</button>
      </p>
      <h3 class="wrong-head" id="wrongHead">错题回顾</h3>
      <ul class="wrong-list" id="wrongList"></ul>
    </section>

    <p class="quiz-hint" data-i18n="challenge.hint">键盘也能用：1–4 选答案，Enter 下一题。</p>
  </main>

  <footer>
    <p data-i18n="footer.text">© 2026 揣卓扬 · 本站是 Web Development 课程项目，内容与代码均由本人编写。没有后端。</p>
  </footer>

  <script src="js/vokabeln-data-b1-6.js"></script>

  <script src="js/challenge.js"></script>
</body>
</html>
